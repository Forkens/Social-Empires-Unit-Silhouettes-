<style>
  body { font-family: Segoe UI, Arial, sans-serif; background: #14171f; color: #e8ecf4; margin: 0; padding: 20px; }
  h1 { margin: 0 0 8px; font-size: 22px; }
  .controls { position: sticky; top: 0; background: #1c212d; padding: 14px; border-radius: 10px; border: 1px solid #2e364a; margin-bottom: 16px; z-index: 10; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
  input, select, button { background: #11151d; color: #e8ecf4; border: 1px solid #3a445d; border-radius: 6px; padding: 7px 10px; font-size: 13px; }
  button { cursor: pointer; background: #2d5be3; border-color: #3d6bf0; font-weight: 600; }
  button.secondary { background: #262c3d; border-color: #3a445d; }
  .summary { width: 100%; font-size: 13px; color: #b7c2d9; line-height: 1.5; }
  .summary strong { color: #fff; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(185px, 1fr)); gap: 12px; }
  .card { background: #1c212d; border: 1px solid #2c3448; border-radius: 10px; padding: 10px; display: flex; flex-direction: column; gap: 6px; }
  .card.match { border-color: #4ade80; box-shadow: 0 0 0 1px #4ade80; }
  .card.parent { border-color: #f59e0b; box-shadow: 0 0 0 1px #f59e0b; }
  .thumb-wrap { width: 100%; height: 145px; background: #0e1117; border-radius: 6px; display: flex; align-items: center; justify-content: center; overflow: hidden; padding: 6px; box-sizing: border-box; }
  .thumb-wrap.light { background: #e8edf5; color: #333; }
  .thumb-wrap img { max-width: 100%; max-height: 100%; object-fit: contain; }
  .thumb-wrap.silhouette img { filter: brightness(0); }
  .name { font-weight: 600; font-size: 13px; line-height: 1.25; }
  .meta { font-size: 11.5px; color: #9aa7c2; line-height: 1.4; }
  .badge { display: inline-block; background: #26314a; color: #93c5fd; padding: 1px 6px; border-radius: 4px; font-weight: 600; }
  .badge.nonmix { background: #2a2e39; color: #9ca3af; }
  .badge.prob { background: #166534; color: #bbf7d0; }
  .p-btns { display: flex; gap: 6px; margin-top: auto; padding-top: 4px; }
  .p-btns button { flex: 1; padding: 4px 6px; font-size: 11px; }
</style>
</head>

 2352, "name": "Golden Armor Draggy", "bo": 0, "img_name": "2352_goldenArmorDraggy", "thumb": "thumbs/2352_goldenArmorDraggy.jpg", "sprite": "sprites/2352.png", "time": 0, "idx": null}, {"id": 2353, "name": "Golden Armor Dragon Rider", "bo": 0, "img_name": "2353_goldenArmorDragonRider", "thumb": "thumbs/2353_goldenArmorDragonRider.jpg", "sprite": "sprites/2353.png", "time": 0, "idx": null}, {"id": 2354, "name": "Abyss Ancient Dragon", "bo": 0, "img_name": "2354_abyssAncientDragon", "thumb": "thumbs/2354_abyssAncientDragon.jpg", "sprite": "sprites/2354.png", "time": 0, "idx": null}, {"id": 2355, "name": "Abyss Ancient Draggy", "bo": 0, "img_name": "2355_abyssAncientDraggy", "thumb": "thumbs/2355_abyssAncientDraggy.jpg", "sprite": "sprites/2355.png", "time": 0, "idx": null}, {"id": 2356, "name": "Abyss Ancient Dragon Rider", "bo": 0, "img_name": "2356_abyssAncientDragonRider", "thumb": "thumbs/2356_abyssAncientDragonRider.jpg", "sprite": "sprites/2356.png", "time": 0, "idx": null}, {"id": 2357, "name": "Platinum Armor Dragon", "bo": 0, "img_name": "2357_platinumArmorDragon", "thumb": "thumbs/2357_platinumArmorDragon.jpg", "sprite": "sprites/2357.png", "time": 0, "idx": null}, {"id": 2358, "name": "Platinum Armor Draggy", "bo": 0, "img_name": "2358_platinumArmorDraggy", "thumb": "thumbs/2358_platinumArmorDraggy.jpg", "sprite": "sprites/2358.png", "time": 0, "idx": null}, {"id": 2359, "name": "Platinum Armor Dragon Rider", "bo": 0, "img_name": "2359_platinumArmorDragonRider", "thumb": "thumbs/2359_platinumArmorDragonRider.jpg", "sprite": "sprites/2359.png", "time": 0, "idx": null}, {"id": 2360, "name": "Bull Armor Dragon", "bo": 0, "img_name": "2360_bullArmorDragon", "thumb": "thumbs/2360_bullArmorDragon.jpg", "sprite": "sprites/2360.png", "time": 0, "idx": null}, {"id": 2361, "name": "Bull Armor Draggy", "bo": 0, "img_name": "2361_bullArmorDraggy", "thumb": "thumbs/2361_bullArmorDraggy.jpg", "sprite": "sprites/2361.png", "time": 0, "idx": null}, {"id": 2362, "name": "Bull Armor Dragon Rider", "bo": 0, "img_name": "2362_bullArmorDragonRider", "thumb": "thumbs/2362_bullArmorDragonRider.jpg", "sprite": "sprites/2362.png", "time": 0, "idx": null}, {"id": 2363, "name": "Night Forge Dragon", "bo": 0, "img_name": "2363_nightForgeDragon", "thumb": "thumbs/2363_nightForgeDragon.jpg", "sprite": "sprites/2363.png", "time": 0, "idx": null}, {"id": 2364, "name": "Night Forge Draggy", "bo": 0, "img_name": "2364_nightForgeDraggy", "thumb": "thumbs/2364_nightForgeDraggy.jpg", "sprite": "sprites/2364.png", "time": 0, "idx": null}, {"id": 2365, "name": "Night Forge Dragon Rider", "bo": 0, "img_name": "2365_nightForgeDragonRider", "thumb": "thumbs/2365_nightForgeDragonRider.jpg", "sprite": "sprites/2365.png", "time": 0, "idx": null}, {"id": 2366, "name": "Devil Ancient Dragon", "bo": 0, "img_name": "2366_devilAncientDragon", "thumb": "thumbs/2366_devilAncientDragon.jpg", "sprite": "sprites/2366.png", "time": 0, "idx": null}, {"id": 2367, "name": "Devil Ancient Draggy", "bo": 0, "img_name": "2367_devilAncientDraggy", "thumb": "thumbs/2367_devilAncientDraggy.jpg", "sprite": "sprites/2367.png", "time": 0, "idx": null}, {"id": 2368, "name": "Devil Ancient Dragon Rider", "bo": 0, "img_name": "2368_devilAncientDragonRider", "thumb": "thumbs/2368_devilAncientDragonRider.jpg", "sprite": "sprites/2368.png", "time": 0, "idx": null}, {"id": 2369, "name": "Elemental Fire Goddess", "bo": 0, "img_name": "2369_elementalFireGoddess", "thumb": "thumbs/2369_elementalFireGoddess.jpg", "sprite": "sprites/2369.png", "time": 0, "idx": null}, {"id": 2370, "name": "Dark Horror Ancient Dragon", "bo": 0, "img_name": "2370_darkHorrorAncientDragon", "thumb": "thumbs/2370_darkHorrorAncientDragon.jpg", "sprite": "sprites/2370.png", "time": 0, "idx": null}, {"id": 2371, "name": "Dark Devourer", "bo": 0, "img_name": "2371_darkHorrorAncientMinion1", "thumb": "thumbs/2371_darkHorrorAncientMinion1.jpg", "sprite": "sprites/2371.png", "time": 0, "idx": null}, {"id": 2372, "name": "Dark Spider", "bo": 0, "img_name": "2372_darkHorrorAncientMinion2", "thumb": "thumbs/2372_darkHorrorAncientMinion2.jpg", "sprite": "sprites/2372.png", "time": 0, "idx": null}, {"id": 2373, "name": "Dark Blow-Bug", "bo": 0, "img_name": "2373_darkHorrorAncientMinion3", "thumb": "thumbs/2373_darkHorrorAncientMinion3.jpg", "sprite": "sprites/2373.png", "time": 0, "idx": null}, {"id": 2374, "name": "Dark Abomination", "bo": 0, "img_name": "2374_darkHorrorAncientMinion4", "thumb": "thumbs/2374_darkHorrorAncientMinion4.jpg", "sprite": "sprites/2374.png", "time": 0, "idx": null}, {"id": 2375, "name": "Dark Horror Ancient Dragon Rider", "bo": 0, "img_name": "2375_darkHorrorAncientDragonRider", "thumb": "thumbs/2375_darkHorrorAncientDragonRider.jpg", "sprite": "sprites/2375.png", "time": 0, "idx": null}, {"id": 2382, "name": "Vulcano Minion", "bo": 0, "img_name": "2076_vulcano_minion", "thumb": "thumbs/2076_vulcano_minion.jpg", "sprite": "sprites/2382.png", "time": 0, "idx": null}];
const MIX_POOL = UNITS.filter(u => u.bo > 0);
const PICTURED_COUNT = UNITS.filter(u => u.sprite || u.thumb).length;
const MAX_POWER = MIX_POOL.length ? MIX_POOL[MIX_POOL.length - 1].bo : 0;

const searchEl = document.getElementById("search");
const viewEl = document.getElementById("viewMode");
const poolEl = document.getElementById("poolFilter");
const sortEl = document.getElementById("sortMode");
const p1El = document.getElementById("p1");
const p2El = document.getElementById("p2");
const onlyEl = document.getElementById("onlyPossible");
const hideEl = document.getElementById("hideMissing");
const summaryEl = document.getElementById("summary");
const gridEl = document.getElementById("grid");

function fmtTime(sec) {
  if (!sec) return "0s";
  const d = Math.floor(sec / 86400);
  const h = Math.floor((sec % 86400) / 3600);
  const m = Math.floor((sec % 3600) / 60);
  return [d ? d + "d" : "", h ? h + "h" : "", m ? m + "m" : ""].filter(Boolean).join(" ") || (sec + "s");
}

for (const u of MIX_POOL) {
  const label = `${u.name} (ID:${u.id}, Order:${u.bo})`;
  p1El.add(new Option(label, u.id));
  p2El.add(new Option(label, u.id));
}

function getUnitIndexByPower(power, id1, id2) {
  for (let i = 0; i < MIX_POOL.length; i++) {
    const u = MIX_POOL[i];
    if (u.id !== id1 && u.id !== id2 && u.bo >= power) return i;
  }
  return MIX_POOL.length - 1;
}

function calcOutcomes() {
  const id1 = Number(p1El.value);
  const id2 = Number(p2El.value);
  if (!id1 || !id2) return null;
  const u1 = MIX_POOL.find(u => u.id === id1);
  const u2 = MIX_POOL.find(u => u.id === id2);
  if (!u1 || !u2) return null;

  const low = Math.min(u1.bo, u2.bo);
  const high = Math.max(u1.bo, u2.bo);
  let base = Math.ceil(low * 0.3 + high * 0.7);
  if (base < 10) base = 10;

  const counts = new Map();
  let highPoolRolls = 0;
  for (let r = 0; r < 12; r++) {
    let p = base + r;
    if (p === high) p++;
    if (p > 400) {
      highPoolRolls++;
    } else {
      const idx = getUnitIndexByPower(p, id1, id2);
      const res = MIX_POOL[idx];
      counts.set(res.id, (counts.get(res.id) || 0) + 1);
    }
  }
  return { u1, u2, base, counts, highPoolRolls };
}

function render() {
  const q = searchEl.value.trim().toLowerCase();
  const mode = viewEl.value;
  const pool = poolEl.value;
  const sortBy = sortEl.value;
  const sim = calcOutcomes();
  const onlyPossible = onlyEl.checked && sim !== null;
  const hideMissing = hideEl.checked;

  let list = UNITS.slice();
  if (sortBy === "id") {
    list.sort((a, b) => a.id - b.id);
  } else if (sortBy === "name") {
    list.sort((a, b) => a.name.localeCompare(b.name));
  }

  if (!sim) {
    summaryEl.innerHTML = `Showing <strong>${PICTURED_COUNT}</strong> pictured units (<strong>${MIX_POOL.length}</strong> in 1.4.07 Soul Mixer pool, Max Order: <strong>${MAX_POWER}</strong>).`;
  } else {
    const parts = [];
    for (const [uid, cnt] of sim.counts.entries()) {
      const u = MIX_POOL.find(x => x.id === uid);
      parts.push(`${u.name} (${cnt}/12)`);
    }
    if (sim.highPoolRolls > 0) {
      parts.push(`Random 400-${MAX_POWER} pool (${sim.highPoolRolls}/12)`);
    }
    summaryEl.innerHTML = `Base power: <strong>${sim.base}</strong> (range ${sim.base}-${sim.base + 11}) &rarr; Possible: <strong>${parts.join(", ")}</strong>`;
  }

  gridEl.innerHTML = "";
  const frag = document.createDocumentFragment();

  for (const u of list) {
    if (hideMissing && !u.sprite && !u.thumb) continue;
    if (pool === "mixable" && u.bo <= 0) continue;
    if (pool === "nonmix" && u.bo > 0) continue;

    const isParent = sim && (u.id === sim.u1.id || u.id === sim.u2.id);
    const rollCount = sim ? (sim.counts.get(u.id) || 0) : 0;
    const inHighPool = sim && sim.highPoolRolls > 0 && !isParent && u.bo >= 400;
    const isMatch = rollCount > 0 || inHighPool;

    if (onlyPossible && !isMatch) continue;
    if (q && !(u.name.toLowerCase().includes(q) || String(u.id).includes(q) || u.img_name.toLowerCase().includes(q))) continue;

    const card = document.createElement("div");
    card.className = "card" + (isParent ? " parent" : isMatch ? " match" : "");

    const thumbWrap = document.createElement("div");
    const useSprite = (mode === "silhouette" || mode === "sprite") && u.sprite;
    thumbWrap.className = "thumb-wrap" + (useSprite ? " light" : "") + (mode === "silhouette" && u.sprite ? " silhouette" : "");

    const src = useSprite ? u.sprite : u.thumb;
    if (src) {
      const img = document.createElement("img");
      img.loading = "lazy";
      img.src = src;
      img.alt = u.name;
      thumbWrap.appendChild(img);
    } else {
      thumbWrap.textContent = "No image";
    }

    const nameDiv = document.createElement("div");
    nameDiv.className = "name";
    nameDiv.textContent = u.name;

    const metaDiv = document.createElement("div");
    metaDiv.className = "meta";
    const orderBadge = u.bo > 0
      ? `<span class="badge">Order ${u.bo}</span>`
      : `<span class="badge nonmix">Not in 1.4.07 Mix</span>`;
    metaDiv.innerHTML = orderBadge + " "
      + (rollCount ? `<span class="badge prob">${rollCount}/12</span> ` : "")
      + (inHighPool ? `<span class="badge prob">400+ pool</span> ` : "")
      + `<br>ID: ${u.id}` + (u.idx !== null ? ` | #${u.idx}` : "")
      + (u.time ? `<br>Time: ${fmtTime(u.time)}` : "")
      + `<br>SWF: ${u.img_name}`;

    card.append(thumbWrap, nameDiv, metaDiv);

    if (u.bo > 0) {
      const btns = document.createElement("div");
      btns.className = "p-btns";
      const b1 = document.createElement("button");
      b1.className = "secondary";
      b1.textContent = "Set P1";
      b1.onclick = () => { p1El.value = u.id; render(); };
      const b2 = document.createElement("button");
      b2.className = "secondary";
      b2.textContent = "Set P2";
      b2.onclick = () => { p2El.value = u.id; render(); };
      btns.append(b1, b2);
      card.appendChild(btns);
    }

    frag.appendChild(card);
  }
  gridEl.appendChild(frag);
}

searchEl.oninput = render;
viewEl.onchange = render;
poolEl.onchange = render;
sortEl.onchange = render;
p1El.onchange = render;
p2El.onchange = render;
onlyEl.onchange = render;
hideEl.onchange = render;
document.getElementById("clearBtn").onclick = () => {
  searchEl.value = ""; poolEl.value = "all"; sortEl.value = "default"; p1El.value = ""; p2El.value = ""; onlyEl.checked = false; hideEl.checked = true; render();
};

render();
</script>
