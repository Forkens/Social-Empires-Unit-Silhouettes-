<title>Social Empires Unit &amp; Silhouette Guide</title>
<style>
  body { font-family: Segoe UI, Arial, sans-serif; background: #14171f; color: #e8ecf4; margin: 0; padding: 20px; }
  h1 { margin: 0 0 8px; font-size: 22px; }
  .controls { position: sticky; top: 0; background: #1c212d; padding: 14px; border-radius: 10px; border: 1px solid #2e364a; margin-bottom: 16px; z-index: 10; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
  @media (max-width: 700px) { .controls { position: static; } }
  input, select, button { background: #11151d; color: #e8ecf4; border: 1px solid #3a445d; border-radius: 6px; padding: 7px 10px; font-size: 13px; }
  select:disabled, input:disabled { opacity: 0.45; cursor: not-allowed; }
  button { cursor: pointer; background: #2d5be3; border-color: #3d6bf0; font-weight: 600; }
  button.secondary { background: #262c3d; border-color: #3a445d; }
  .summary { width: 100%; font-size: 13px; color: #b7c2d9; line-height: 1.5; }
  .summary strong { color: #fff; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(185px, 1fr)); gap: 12px; }
  .card { background: #1c212d; border: 1px solid #2c3448; border-radius: 10px; padding: 10px; display: flex; flex-direction: column; gap: 6px; }
  .card.match { border-color: #4ade80; box-shadow: 0 0 0 1px #4ade80; }
  .card.parent { border-color: #f59e0b; box-shadow: 0 0 0 1px #f59e0b; }
  .thumb-wrap { width: 100%; height: 145px; background: #0e1117; border-radius: 6px; display: flex; align-items: center; justify-content: center; overflow: hidden; padding: 6px; box-sizing: border-box; }
  .thumb-wrap.light { background: #e8edf5; color: #333; }
  .thumb-wrap img { max-width: 100%; max-height: 100%; object-fit: contain; }
  .thumb-wrap.silhouette img { filter: brightness(0); }
  .name { font-weight: 600; font-size: 13px; line-height: 1.25; }
  .meta { font-size: 11.5px; color: #9aa7c2; line-height: 1.45; }
  .badge { display: inline-block; background: #26314a; color: #93c5fd; padding: 1px 6px; border-radius: 4px; font-weight: 600; }
  .badge.reborn { background: #31214a; color: #d8b4fe; }
  .badge.est { background: #3b2f16; color: #fcd34d; }
  .badge.nonmix { background: #2a2e39; color: #9ca3af; }
  .badge.prob { background: #166534; color: #bbf7d0; }
  .tr-res { color: #5eead4; }
  .tr-cash { color: #fda4af; }
  .tr-none { color: #6b7280; }
  .p-btns { display: flex; gap: 6px; margin-top: auto; padding-top: 4px; }
  .p-btns button { flex: 1; padding: 4px 6px; font-size: 11px; }
</style>
</head>

<div class="controls">

    <option value="reborn">Mode: Empires Reborn (Exact Battle Power)</option>
  </select>
  <select id="weightMode">

    <option value="0.6">Formula: 40% / 60%</option>
    <option value="0.5">Formula: 50% / 50%</option>

  <input id="search" type="text" placeholder="Search name, ID, building, SWF..." style="min-width:200px;">

    <option value="sprite">View: Full Sprite (Color)</option>
    <option value="thumb">View: Portrait Thumbnail</option>
  </select>
  <select id="poolFilter">

    <option value="mixable">Show: Mixable Only</option>
    <option value="nonmix">Show: Non-Mixable Only</option>

    <option value="none">Trainable: Not Trainable</option>

    <option value="id">Sort: Unit ID</option>

  <select id="p2"><option value="">-- Parent 2 --</option></select>

  <label style="font-size:13px;"><input id="hideDrag" type="checkbox"> Hide Draggies/Minions</label>
  <label style="font-size:13px;"><input id="hideMissing" type="checkbox" checked> Hide units with no image</label>
  <button id="clearBtn" class="secondary" type="button">Reset</button>
  <div id="summary" class="summary"></div>
</div>

const poolModeEl = document.getElementById("poolMode");
const weightEl = document.getElementById("weightMode");
const searchEl = document.getElementById("search");
const viewEl = document.getElementById("viewMode");
const poolEl = document.getElementById("poolFilter");
const trainEl = document.getElementById("trainFilter");
const sortEl = document.getElementById("sortMode");
const p1El = document.getElementById("p1");
const p2El = document.getElementById("p2");
const minPwrEl = document.getElementById("minPwr");
const maxPwrEl = document.getElementById("maxPwr");
const onlyEl = document.getElementById("onlyPossible");
const hideDragEl = document.getElementById("hideDrag");
const hideEl = document.getElementById("hideMissing");
const summaryEl = document.getElementById("summary");
const gridEl = document.getElementById("grid");

function esc(s) {
  return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

function isReborn() { return poolModeEl.value === "reborn"; }
function getBo(u) { return poolModeEl.value === "exp" ? u.bo_est : u.bo; }
function getTime(u) { return poolModeEl.value === "exp" ? u.time_est : u.time; }

function getMixPool() {
  if (isReborn()) {
    return UNITS.filter(u => u.in_reb && u.rp > 0 && (u.sprite || u.thumb)).sort((a, b) => a.rp - b.rp || a.id - b.id);
  }
  return UNITS.filter(u => getBo(u) > 0).sort((a, b) => getBo(a) - getBo(b) || a.id - b.id);
}

function rebuildDropdowns() {
  const prev1 = p1El.value;
  const prev2 = p2El.value;
  p1El.length = 1;
  p2El.length = 1;
  const reb = isReborn();
  for (const u of getMixPool()) {
    const label = reb
      ? `${u.name} (Power:${u.rp}, ID:${u.id})`
      : `${u.name} (ID:${u.id}, Order:${(poolModeEl.value === "exp" && u.est) ? "~" : ""}${getBo(u)})`;
    p1El.add(new Option(label, u.id));
    p2El.add(new Option(label, u.id));
  }
  p1El.value = prev1;
  p2El.value = prev2;
  weightEl.disabled = reb;
  poolEl.disabled = reb;
}

function autoFillRebornRange() {
  if (!isReborn()) return;
  const pool = getMixPool();
  const u1 = pool.find(u => u.id === Number(p1El.value));
  const u2 = pool.find(u => u.id === Number(p2El.value));
  if (!u1 || !u2) return;
  const lo = Math.min(u1.rp, u2.rp);
  const hi = Math.max(u1.rp, u2.rp);
  const ratio = hi > 0 ? lo / hi : 0;
  const minEst = hi + 1 + Math.max(0, Math.round((ratio - 0.80) * 550));
  const maxEst = hi + Math.max(55, Math.round(lo * 0.55));
  minPwrEl.value = minEst;
  maxPwrEl.value = maxEst;
}

function fmtTime(sec) {
  if (!sec) return "0s";
  const d = Math.floor(sec / 86400);
  const h = Math.floor((sec % 86400) / 3600);
  const m = Math.floor((sec % 3600) / 60);
  return [d ? d + "d" : "", h ? h + "h" : "", m ? m + "m" : ""].filter(Boolean).join(" ") || (sec + "s");
}

function getUnitIndexByPower(pool, power, id1, id2) {
  for (let i = 0; i < pool.length; i++) {
    const u = pool[i];
    if (u.id !== id1 && u.id !== id2 && getBo(u) >= power) return i;
  }
  return pool.length - 1;
}

function calcOutcomes() {
  const pool = getMixPool();
  const id1 = Number(p1El.value);
  const id2 = Number(p2El.value);

  if (isReborn()) {
    const u1 = pool.find(u => u.id === id1) || null;
    const u2 = pool.find(u => u.id === id2) || null;
    const minV = minPwrEl.value !== "" ? Number(minPwrEl.value) : null;
    const maxV = maxPwrEl.value !== "" ? Number(maxPwrEl.value) : null;
    if (!u1 && !u2 && minV === null && maxV === null) return null;
    return { reborn: true, u1, u2, minV, maxV, pool };
  }

  if (!id1 || !id2) return null;
  const u1 = pool.find(u => u.id === id1);
  const u2 = pool.find(u => u.id === id2);
  if (!u1 || !u2) return null;

  const maxPower = pool.length ? getBo(pool[pool.length - 1]) : 0;
  const bo1 = getBo(u1), bo2 = getBo(u2);
  const low = Math.min(bo1, bo2);
  const high = Math.max(bo1, bo2);

  let base, minOff, maxOff;
  if (weightEl.value === "fb_sqrt") {
    base = Math.max(10, Math.round(Math.pow(0.3 * Math.sqrt(low) + 0.7 * Math.sqrt(high), 2)));
    minOff = -10;
    maxOff = 16;
  } else {
    const wHigh = Number(weightEl.value);
    const wLow = 1 - wHigh;
    base = Math.max(10, Math.ceil(low * wLow + high * wHigh));
    minOff = 0;
    maxOff = 11;
  }

  const totalRolls = maxOff - minOff + 1;
  const counts = new Map();
  let highPoolRolls = 0;
  for (let r = minOff; r <= maxOff; r++) {
    let p = Math.max(1, base + r);
    if (p === high) p++;
    if (p > 400) {
      highPoolRolls++;
    } else {
      const idx = getUnitIndexByPower(pool, p, id1, id2);
      const res = pool[idx];
      counts.set(res.id, (counts.get(res.id) || 0) + 1);
    }
  }
  return {
    reborn: false, u1, u2, base,
    minP: Math.max(1, base + minOff),
    maxP: base + maxOff,
    totalRolls, counts, highPoolRolls, maxPower, pool
  };
}

function render() {
  const reb = isReborn();
  const mixPool = getMixPool();
  const maxPower = mixPool.length ? (reb ? mixPool[mixPool.length - 1].rp : getBo(mixPool[mixPool.length - 1])) : 0;
  const picturedCount = UNITS.filter(u => (u.sprite || u.thumb) && (!reb || u.in_reb)).length;
  const q = searchEl.value.trim().toLowerCase();
  const mode = viewEl.value;
  const poolFilter = poolEl.value;
  const trainFilter = trainEl.value;
  const sortBy = sortEl.value;
  const sim = calcOutcomes();
  const onlyPossible = onlyEl.checked && sim !== null;
  const hideDrag = hideDragEl.checked;
  const hideMissing = hideEl.checked;
  const manMin = minPwrEl.value !== "" ? Number(minPwrEl.value) : null;
  const manMax = maxPwrEl.value !== "" ? Number(maxPwrEl.value) : null;

  let list = UNITS.slice();
  if (sortBy === "reborn" || (sortBy === "default" && reb)) {
    list.sort((a, b) => (a.rp - b.rp) || (a.id - b.id));
  } else if (sortBy === "default") {
    list.sort((a, b) => {
      const ba = getBo(a), bb = getBo(b);
      if ((ba > 0) !== (bb > 0)) return ba > 0 ? -1 : 1;
      return ba > 0 ? (ba - bb || a.id - b.id) : (a.id - b.id);
    });
  } else if (sortBy === "id") {
    list.sort((a, b) => a.id - b.id);
  } else if (sortBy === "name") {
    list.sort((a, b) => a.name.localeCompare(b.name));
  }

  if (!sim) {
    summaryEl.innerHTML = reb
      ? `Showing <strong>${picturedCount}</strong> Empires Reborn units (Max Power: <strong>${maxPower}</strong>). Filter with Min/Max Power or pick parents to preview a window.`
      : `Showing <strong>${picturedCount}</strong> pictured units (<strong>${mixPool.length}</strong> mixable in this mode, Max Order: <strong>${maxPower}</strong>).`;
  } else if (sim.reborn) {
    const rText = (sim.minV !== null || sim.maxV !== null)
      ? `<strong>${sim.minV ?? 0} .. ${sim.maxV ?? maxPower}</strong>`
      : `any power`;
    summaryEl.innerHTML = `Empires Reborn filter: highlighting power ${rText} (approx. window; edit Min/Max Pwr boxes to match exact in-game range).`;
  } else {
    const parts = [];
    for (const [uid, cnt] of sim.counts.entries()) {
      const u = sim.pool.find(x => x.id === uid);
      parts.push(`${esc(u.name)} (${cnt}/${sim.totalRolls})`);
    }
    if (sim.highPoolRolls > 0) {
      parts.push(`Random 400-${sim.maxPower} pool (${sim.highPoolRolls}/${sim.totalRolls})`);
    }
    const shownParts = parts.length > 10
      ? parts.slice(0, 8).join(", ") + ` ... (+${parts.length - 8} more — check "Possible results only")`
      : parts.join(", ");
    summaryEl.innerHTML = `Base power: <strong>${sim.base}</strong> (range ${sim.minP}-${sim.maxP}) &rarr; Possible: <strong>${shownParts}</strong>`;
  }

  gridEl.innerHTML = "";
  const frag = document.createDocumentFragment();

  for (const u of list) {
    if (reb && !u.in_reb) continue;
    if (hideMissing && !u.sprite && !u.thumb) continue;
    const nmLow = u.name.toLowerCase();
    if (hideDrag && (nmLow.includes("draggy") || nmLow.includes("minion"))) continue;
    if (trainFilter !== "all" && u.tt !== trainFilter) continue;
    const uBo = getBo(u);
    if (!reb) {
      if (poolFilter === "mixable" && uBo <= 0) continue;
      if (poolFilter === "nonmix" && uBo > 0) continue;
    }
    if (!reb && (manMin !== null && u.rp < manMin)) continue;
    if (!reb && (manMax !== null && u.rp > manMax)) continue;

    const isParent = sim && ((sim.u1 && u.id === sim.u1.id) || (sim.u2 && u.id === sim.u2.id));
    let rollCount = 0;
    let inHighPool = false;
    let isMatch = false;

    if (sim) {
      if (sim.reborn) {
        const hasRange = (sim.minV !== null || sim.maxV !== null);
        if (hasRange && !isParent) {
          isMatch = (sim.minV === null || u.rp >= sim.minV) && (sim.maxV === null || u.rp <= sim.maxV);
        }
      } else {
        rollCount = sim.counts.get(u.id) || 0;
        inHighPool = sim.highPoolRolls > 0 && !isParent && uBo >= 400;
        isMatch = rollCount > 0 || inHighPool;
      }
    }

    if (onlyPossible && !isMatch) continue;
    if (q && !(nmLow.includes(q) || String(u.id).includes(q) || u.img_name.toLowerCase().includes(q) || u.tr.toLowerCase().includes(q))) continue;

    const card = document.createElement("div");
    card.className = "card" + (isParent ? " parent" : isMatch ? " match" : "");

    const thumbWrap = document.createElement("div");
    const useSprite = (mode === "silhouette" || mode === "sprite") && u.sprite;
    thumbWrap.className = "thumb-wrap" + (useSprite ? " light" : "") + (mode === "silhouette" && u.sprite ? " silhouette" : "");

    const src = useSprite ? u.sprite : u.thumb;
    if (src) {
      const img = document.createElement("img");
      img.loading = "lazy";
      img.src = src;
      img.alt = u.name;
      thumbWrap.appendChild(img);
    } else {
      thumbWrap.textContent = "No image";
    }

    const nameDiv = document.createElement("div");
    nameDiv.className = "name";
    nameDiv.textContent = u.name;

    const metaDiv = document.createElement("div");
    metaDiv.className = "meta";

    let topBadges = "";
    if (reb) {
      topBadges = `<span class="badge reborn">Power ${u.rp}</span>`;
    } else {
      let orderBadge = `<span class="badge nonmix">Not mixable</span>`;
      if (uBo > 0) {
        orderBadge = (poolModeEl.value === "exp" && u.est)
          ? `<span class="badge est">Est. Order ${uBo}</span>`
          : `<span class="badge">Order ${uBo}</span>`;
      }
      topBadges = orderBadge
        + (rollCount ? ` <span class="badge prob">${rollCount}/${sim.totalRolls}</span>` : "")
        + (inHighPool ? ` <span class="badge prob">400+ pool</span>` : "");
    }

    const trainLine = u.tt === "res"
      ? `<br><span class="tr-res">Trains: ${esc(u.tr)}</span>`
      : u.tt === "cash"
        ? `<br><span class="tr-cash">Trains: ${esc(u.tr)}</span>`
        : `<br><span class="tr-none">Not Trainable</span>`;

    const t = getTime(u);
    metaDiv.innerHTML = topBadges
      + `<br>ID: ${u.id}` + (reb ? ` | HP ${u.life} / ATK ${u.atk}` : ` | Reborn Pwr: ${u.rp}`)
      + trainLine
      + (!reb && t ? `<br>Time: ${fmtTime(t)}` : "")
      + `<br>SWF: ${esc(u.img_name)}`;

    card.append(thumbWrap, nameDiv, metaDiv);

    if (reb || uBo > 0) {
      const btns = document.createElement("div");
      btns.className = "p-btns";
      const b1 = document.createElement("button");
      b1.className = "secondary";
      b1.textContent = "Set P1";
      b1.onclick = () => { p1El.value = u.id; autoFillRebornRange(); render(); };
      const b2 = document.createElement("button");
      b2.className = "secondary";
      b2.textContent = "Set P2";
      b2.onclick = () => { p2El.value = u.id; autoFillRebornRange(); render(); };
      btns.append(b1, b2);
      card.appendChild(btns);
    }

    frag.appendChild(card);
  }
  gridEl.appendChild(frag);
}

poolModeEl.onchange = () => { minPwrEl.value = ""; maxPwrEl.value = ""; rebuildDropdowns(); autoFillRebornRange(); render(); };
weightEl.onchange = render;
searchEl.oninput = render;
viewEl.onchange = render;
poolEl.onchange = render;
trainEl.onchange = render;
sortEl.onchange = render;
p1El.onchange = () => { autoFillRebornRange(); render(); };
p2El.onchange = () => { autoFillRebornRange(); render(); };
minPwrEl.oninput = render;
